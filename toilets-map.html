<script>(function(){var f,g={path:function(p){return String(p).split(/[?#]/)[0]||'/'},referrer:function(r){try{return new URL(r).origin===location.origin?'':r}catch(e){return ''}}};Object.defineProperty(g,'get_data',{configurable:true,enumerable:true,get:function(){return f},set:function(h){f=function(v){var d=h(v),m=/[?&]ref=([A-Za-z0-9_-]{1,40})(?:&|$)/.exec(d.q||'');d.q=m?'?ref='+m[1]:'';return d}}});window.goatcounter=g})();</script>

<body class="jp jp-map">
<div class="page page-map">
  <div class="tricolore-rail"><span></span><span></span><span></span></div>
  <!-- shell:top -->
  <header class="app-bar">
    <a class="app-bar-brand" href="index.html"><span class="app-bar-flag" aria-hidden="true"><i></i><i></i><i></i></span>パリおすすめ</a>
    <a class="app-bar-sos" href="emergency.html">困ったとき</a>
  </header>
<!-- /shell:top -->
  <header class="map-head">
    <h1 class="map-title">トイレマップ</h1>
    <span id="map-count" class="map-count" role="status" aria-live="polite"></span>
    <button id="map-filter-toggle" class="btn btn-outline" type="button" aria-expanded="false" aria-controls="map-sheet">絞り込み</button>
  </header>
  <details class="map-help">
    <summary>このマップについて</summary>
    <p>パリ市内581件の公衆トイレ(稼働中のみ)を地図上に表示します。エリアで絞り込んだり、現在地・住所から近くを探せます。出典: <a class="ranking-source" href="https://opendata.paris.fr/explore/dataset/sanisettesparis/">Paris Data「Toilettes publiques」↗</a>(パリ市公式オープンデータ)。位置情報は住所から自動計算しており、実際の設置位置と数十m程度ずれる場合があります。取得時点のデータで、現在の故障・清掃中は分かりません。</p>
  </details>
  <section class="map-section" aria-label="地図">
    <div class="map-toolbar">
      <div class="map-search-box">
        <input id="map-address-input" class="map-search-input" type="text" placeholder="住所・ホテル名で検索">
        <button id="map-address-btn" class="map-search-btn" type="button">検索</button>
      </div>
    </div>
    <p id="map-search-status" class="map-status" role="status" aria-live="polite"></p>
    <div id="map-candidates" class="map-candidates"></div>
    <div class="map-wrap">
      <div id="map-canvas"></div>
      <div id="map-notice" class="map-empty" aria-live="polite"></div>
      <div id="map-sheet" class="map-sheet" hidden></div>
    </div>
  </section>
</div>
