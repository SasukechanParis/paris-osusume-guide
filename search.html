<script>(function(){var f,g={path:function(p){return String(p).split(/[?#]/)[0]||'/'},referrer:function(r){try{return new URL(r).origin===location.origin?'':r}catch(e){return ''}}};Object.defineProperty(g,'get_data',{configurable:true,enumerable:true,get:function(){return f},set:function(h){f=function(v){var d=h(v),m=/[?&]ref=([A-Za-z0-9_-]{1,40})(?:&|$)/.exec(d.q||'');d.q=m?'?ref='+m[1]:'';return d}}});window.goatcounter=g})();</script>

    <a class="app-bar-sos" href="emergency.html">困ったとき</a>
  </header>
<!-- /shell:top -->
  <main class="search-main">
    <div class="search-head">
      <h1 class="search-title">探す</h1>
      <form id="search-form" class="search-bar" role="search" action="search.html" method="get">
        <label class="visually-hidden" for="search-q">キーワード</label>
        <input id="search-q" name="q" class="search-input" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="店名・クロワッサン・免税など">
        <button type="submit" class="btn search-submit">検索</button>
      </form>
      <div class="search-tools">
        <button id="filter-toggle" class="btn btn-outline" type="button" aria-expanded="false" aria-controls="filter-panel">条件を絞る<span id="filter-count" class="filter-count" hidden></span></button>
        <div class="view-switch" role="group" aria-label="表示の切り替え">
          <button id="view-list" type="button" class="view-btn" aria-pressed="true">一覧</button>
          <button id="view-map" type="button" class="view-btn" aria-pressed="false">地図</button>
        </div>
      </div>
    </div>

    <div id="page-status" class="page-status"></div>
    <div id="filter-panel" class="filter-panel" hidden></div>

    <section id="list-view" class="list-view" aria-label="検索結果">
      <div id="active-filters" class="chip-row active-filters"></div>
      <p id="result-summary" class="result-summary" role="status" aria-live="polite"></p>
      <div id="articles" class="article-list"></div>
      <div id="results"></div>
      <div id="more-wrap" class="nearby-more"></div>
    </section>

    <section id="map-view" class="search-map-view" aria-label="地図" hidden>
      <div id="search-map-wrap" class="search-map-wrap">
        <div id="search-map"></div>
        <button id="map-search-here" class="btn map-search-here" type="button" hidden>この範囲で探す</button>
        <div id="map-notice" class="map-empty" aria-live="polite"></div>
        <div id="map-peek" class="map-peek" hidden></div>
      </div>
    </section>
  </main>
</div>
