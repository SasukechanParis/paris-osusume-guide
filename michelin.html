  </header>
<!-- /shell:top -->
  <header class="hero">
    <h1 class="title">ミシュラン<span class="accent">星付き</span></h1>
    <p class="lede">パリにあるミシュランの星付きのお店を全127軒まとめました(2026年版)。★・区・ジャンルで絞り込めます。</p>
    <picture>
      <source type="image/webp" srcset="assets/illustrations/michelin-800.webp 800w, assets/illustrations/michelin-1400.webp 1400w" sizes="(min-width: 760px) 720px, 100vw">
      <img class="hero-image" src="assets/illustrations/michelin.png" width="1672" height="941" alt="印象派タッチで描かれたミシュラン料理のイラスト" loading="lazy" decoding="async">
    </picture>
  </header>

  <section aria-labelledby="nearby-h">
    <div class="section-head"><div class="flag-dot"><i></i><i></i><i></i></div><h2 id="nearby-h">近くのミシュランの星付き店を探す</h2></div>
    <p class="section-note">現在地、またはホテル名・住所を入力すると、近いミシュランの星付き店を距離順に表示します</p>

    <div class="nearby-form">
      <button id="gps-btn" class="btn gps-btn" type="button">現在地から探す</button>
      <div class="nearby-divider">または住所・ホテル名で検索</div>
      <div class="nearby-row">
        <input id="address-input" class="nearby-input" type="text" placeholder="例: Hôtel de la Paix, 9e arrondissement">
        <button id="address-search-btn" class="btn btn-outline" type="button">検索</button>
      </div>
      <p id="nearby-status" class="section-note" style="margin:0;"></p>
    </div>

    <div id="nearby-results" class="nearby-results"></div>
  </section>

  <section aria-labelledby="michelin-h">
    <div class="section-head"><div class="flag-dot"><i></i><i></i><i></i></div><h2 id="michelin-h">星付きレストラン</h2></div>

    <div class="year-tabs" id="star-tabs">
      <button class="tab-btn active" data-stars="all" type="button">すべて</button>
      <button class="tab-btn" data-stars="3" type="button">★★★</button>
      <button class="tab-btn" data-stars="2" type="button">★★</button>
      <button class="tab-btn" data-stars="1" type="button">★</button>
    </div>

    <div class="michelin-filter-row">
      <div class="michelin-filter">
        <label for="michelin-arr-select">区で絞り込み</label>
        <select id="michelin-arr-select"></select>
      </div>
      <div class="michelin-filter">
        <label for="michelin-genre-select">ジャンルで絞り込み</label>
        <select id="michelin-genre-select"></select>
      </div>
    </div>

    <p id="michelin-count" class="section-note"></p>
    <div id="michelin-list"></div>
  </section>


  <footer class="site-footer">
    <p>店舗の位置情報は住所から自動計算しており、実際の建物位置と数十m程度ずれる場合があります。正確な場所はGoogleマップ上で改めてご確認ください。</p>
  </footer>
</div>
